name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.11
      uses: actions/setup-python@v3
      with:
        python-version: "3.11"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov pydantic beautifulsoup4 requests click
        pip install -e ./ai_intel_processing
        pip install -e ./ai_hackernews_ingest
        pip install -e ./ai_techcrunch_ingest
        pip install -e ./ai_capital_mcp
    - name: Test with pytest
      env:
        OPENAI_API_KEY: "dummy-key-for-ci"
        DB_PATH: "/tmp/scrapers.db"
      run: |
        pytest tests/
