[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai_capital_mcp"
version = "0.1.0"
dependencies = [
    "mcp",
    "pydantic",
    "cachetools"
]

[project.scripts]
ai-capital-mcp = "ai_capital_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
